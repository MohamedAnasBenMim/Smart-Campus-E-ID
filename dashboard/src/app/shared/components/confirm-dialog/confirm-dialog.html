<div class="dialog-icon" [class.dialog-icon-danger]="data.dangereux">
  <mat-icon>{{ data.dangereux ? 'warning' : 'help_outline' }}</mat-icon>
</div>

<h2 mat-dialog-title>{{ data.titre }}</h2>

<mat-dialog-content>
  <p>{{ data.message }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="annuler()">Annuler</button>
  <button
    mat-flat-button
    [class.button-danger]="data.dangereux"
    (click)="confirmer()"
    cdkFocusInitial
  >
    {{ data.labelConfirmer ?? 'Confirmer' }}
  </button>
</mat-dialog-actions>
